name: Rock Paper Scissors

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  play:
    if: startsWith(github.event.issue.title, 'rps|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const user = (issue.user && issue.user.login) || 'player';
            const move = issue.title.split('|')[1].trim().toLowerCase();
            const icons = { rock: '✊', paper: '✋', scissors: '✌️' };
            const beats = { rock: 'scissors', paper: 'rock', scissors: 'paper' };
            const options = Object.keys(icons);

            if (!options.includes(move)) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: 'Invalid move. Please use the buttons in my README. 🙂'
              });
            } else {
              const bot = options[Math.floor(Math.random() * 3)];
              let result;
              if (move === bot) result = "🤝 It's a draw!";
              else if (beats[move] === bot) result = `🎉 You win, @${user}!`;
              else result = '🤖 I win this round! Try again?';

              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: `**You:** ${icons[move]} ${move}\n**Me:** ${icons[bot]} ${bot}\n\n${result}\n\n[Play again](https://github.com/${context.repo.owner}/${context.repo.repo}#-play-rock-paper-scissors-with-me)`
              });
            }

            await github.rest.issues.update({
              ...context.repo, issue_number: issue.number, state: 'closed'
            });
