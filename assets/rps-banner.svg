<svg xmlns="http://www.w3.org/2000/svg" width="840" height="130" viewBox="0 0 840 130" role="img" aria-label="Rock Paper Scissors" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Rock Paper Scissors</title>
<defs>
<linearGradient id="tx" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
<stop offset="0" stop-color="#fb923c"/><stop offset=".5" stop-color="#7C3AED"/><stop offset="1" stop-color="#22d3ee"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0;0.4 0;-0.4 0" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="bgb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f0c29"/><stop offset=".5" stop-color="#302b63"/><stop offset="1" stop-color="#24243e"/></linearGradient>
</defs>
<style>
.t{animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.9}50%{opacity:1}}
.sub{animation:sub 2.5s ease-in-out infinite}
@keyframes sub{0%,100%{opacity:.55}50%{opacity:1}}
.d{animation:d 2.4s ease-in-out infinite}
.d2{animation:d 2.4s ease-in-out .4s infinite}
.d3{animation:d 2.4s ease-in-out .8s infinite}
@keyframes d{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-6px);opacity:1}}
</style>
<rect width="840" height="130" rx="20" fill="url(#bgb)"/>
<rect x="1.5" y="1.5" width="837" height="127" rx="19" fill="none" stroke="#7C3AED" stroke-opacity=".5" stroke-width="2"/>
<text class="t" x="420" y="68" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="38" font-weight="900" letter-spacing="4" fill="url(#tx)">ROCK · PAPER · SCISSORS</text>
<g fill="#7C3AED"><circle class="d" cx="250" cy="102" r="4"/><circle class="d2" cx="420" cy="102" r="4" fill="#22d3ee"/><circle class="d3" cx="590" cy="102" r="4" fill="#fb923c"/></g>
<text class="sub" x="420" y="108" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="14" letter-spacing="3" fill="#fff">BEAT THE BOT · ONE CLICK · RESULT IN SECONDS</text>
</svg>
