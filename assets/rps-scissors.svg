<svg xmlns="http://www.w3.org/2000/svg" width="220" height="270" viewBox="0 0 220 270" role="img" aria-label="Play Scissors" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Play Scissors</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e1a4d"/><stop offset="1" stop-color="#0f0c29"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a3e635"/><stop offset="1" stop-color="#10b981"/></linearGradient>
<linearGradient id="ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2e8f0"/><stop offset="1" stop-color="#64748b"/></linearGradient>
<radialGradient id="gl" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#a3e635" stop-opacity=".55"/><stop offset="1" stop-color="#a3e635" stop-opacity="0"/></radialGradient>
</defs>

<style>
.float{animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.shadow{animation:shadow 3s ease-in-out infinite;transform-origin:110px 176px}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.45}50%{transform:scale(.8);opacity:.25}}
.pulse{animation:pulse 2.6s ease-in-out infinite;transform-origin:110px 108px}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.9)}50%{opacity:.95;transform:scale(1.12)}}
.sway{animation:sway 2.8s ease-in-out infinite;transform-origin:110px 107px}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.snip{animation:snip 1.4s ease-in-out infinite;transform-origin:110px 105px}
@keyframes snip{0%,100%{transform:rotate(-13deg)}50%{transform:rotate(7deg)}}
.run{animation:run 3.5s linear infinite}
@keyframes run{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
.tw{animation:tw 2s ease-in-out infinite}
.tw2{animation:tw 2s ease-in-out .7s infinite}
.tw3{animation:tw 2s ease-in-out 1.3s infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.btn{animation:btn 1.8s ease-in-out infinite;transform-origin:110px 241px}
@keyframes btn{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
</style>

<rect x="3" y="3" width="214" height="264" rx="22" fill="url(#bg)"/>
<rect x="3" y="3" width="214" height="264" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
<rect class="run" x="3" y="3" width="214" height="264" rx="22" fill="none" stroke="url(#ac)" stroke-width="3.5" stroke-linecap="round" pathLength="100" stroke-dasharray="18 82"/>
<circle class="pulse" cx="110" cy="108" r="78" fill="url(#gl)"/>
<g fill="#fff"><path class="tw" d="M36 52 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 z" transform-origin="39 55"/>
<path class="tw2" d="M184 78 l2.5 -7 l2.5 7 l7 2.5 l-7 2.5 l-2.5 7 l-2.5 -7 l-7 -2.5 z" transform-origin="186 81"/>
<path class="tw3" d="M170 36 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 z" transform-origin="172 38"/></g>

<ellipse class="shadow" cx="110" cy="176" rx="40" ry="7" fill="#000"/>
<g class="float">
<g class="snip">
<polygon points="98,40 105,105 115,105" fill="url(#ic)"/>
<line x1="110" y1="105" x2="122" y2="138" stroke="#f43f5e" stroke-width="7" stroke-linecap="round"/>
<circle cx="127" cy="152" r="14" fill="none" stroke="#f43f5e" stroke-width="7"/>
</g>
<g transform="translate(220,0) scale(-1,1)"><g class="snip">
<polygon points="98,40 105,105 115,105" fill="url(#ic)"/>
<line x1="110" y1="105" x2="122" y2="138" stroke="#f43f5e" stroke-width="7" stroke-linecap="round"/>
<circle cx="127" cy="152" r="14" fill="none" stroke="#f43f5e" stroke-width="7"/>
</g></g>
<circle cx="110" cy="105" r="6" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
</g>
<text x="110" y="204" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="26" font-weight="800" letter-spacing="3" fill="#fff">SCISSORS</text>
<text x="110" y="221" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="11" fill="#fff" fill-opacity=".6">Cuts Paper</text>
<g class="btn"><rect x="40" y="228" width="140" height="28" rx="14" fill="url(#ac)"/>
<polygon points="66,236 66,248 76,242" fill="#0b0920"/>
<text x="86" y="247" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1.5" fill="#0b0920">PLAY NOW</text></g>
</svg>
